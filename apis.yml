aid: echo-labs
name: Echo Labs
description: >-
  Echo Labs is a San Francisco-based company building AI-powered media
  accessibility for higher education. Its platform audits, captions, and audio
  describes entire institutional video libraries within 24 hours, producing
  ADA / Title II and WCAG 2.1 AA compliant closed captions and audio
  descriptions at claimed accuracy above 99 percent and roughly $0.75 per
  minute — a fraction of legacy vendor pricing. Echo integrates with major
  learning management systems (7+ LMS platforms) so universities and colleges
  can bring existing course video into compliance at institutional scale. The
  company is SOC 2 certified, completed a pre-seed round, and is a Techstars
  portfolio company. This API Evangelist profile tracks Echo Labs as a company
  in the network; the provider does not publish a public API or developer
  portal at this time.
